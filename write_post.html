<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 - 충신동 도심복합개발 통합 추진위원회</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="site-logo">
                <div class="logo-symbol">忠</div>
                <div class="logo-text-wrap">
                    <h1>충신동 도심복합개발</h1>
                    <div class="logo-sub"><span>통합 추진위원회</span></div>
                </div>
            </a>
            <nav class="main-nav" id="main-nav">
                <a href="index.html" class="nav-link">홈</a>
                <a href="project_overview.html" class="nav-link">사업개요</a>
                <a href="notice_board.html" class="nav-link">공지·자료실</a>
                <a href="community_board.html" class="nav-link active">주민커뮤니티</a>
                <a href="transparency_center.html" class="nav-link">투명성센터</a>
            </nav>
            <div style="display: flex; align-items: center; gap: 10px;">
                <button class="mobile-menu-btn" id="mobile-menu-toggle" aria-label="메뉴 열기">☰</button>
            </div>
        </div>
    </header>

    <main class="page-wrapper">
        <div class="subpage-header" style="background: linear-gradient(135deg, #1e3a5f 0%, #134e4a 100%);">
            <span class="subpage-badge">COMMUNITY POST</span>
            <h2>✍️ 주민 의견 및 문의 작성</h2>
            <p>도심복합개발에 관한 의견이나 질문을 남겨주시면 위원회에서 신속하게 확인하고 성실히 답변드립니다.</p>
        </div>

        <article class="content-card" style="max-width: 800px; margin: 0 auto;">
            <form id="postForm">
                <div class="form-group">
                    <label class="form-label" for="authorName">작성자 성명 (또는 닉네임)</label>
                    <input type="text" id="authorName" class="form-control" placeholder="예: 충신동 소유자" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="postTitle">게시글 제목</label>
                    <input type="text" id="postTitle" class="form-control" placeholder="제목을 입력하세요 (예: 성장거점형 사업성 관련 문의)" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="postContent">게시글 내용</label>
                    <textarea id="postContent" class="form-control" placeholder="도심복합개발 및 수직입체도시 프로젝트에 대한 의견, 건의사항, 질문 내용을 자유롭게 작성해 주세요." required></textarea>
                </div>

                <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 28px;">
                    <a href="community_board.html" class="btn-secondary-renew" style="color: var(--text-muted); border-color: var(--border-medium);">취소</a>
                    <button type="submit" class="btn-primary-renew">게시글 등록하기</button>
                </div>
            </form>
        </article>
    </main>

    <footer class="site-footer">
        <div class="footer-bottom">
            <span>&copy; 2026 충신동 도심복합개발 통합 추진위원회</span>
        </div>
    </footer>

    <script>
        document.getElementById('mobile-menu-toggle')?.addEventListener('click', function() {
            document.getElementById('main-nav')?.classList.toggle('show');
        });

        document.getElementById('postForm')?.addEventListener('submit', function(e) {
            e.preventDefault();
            const author = document.getElementById('authorName').value.trim();
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();

            if (!title || !content) return;

            const now = new Date();
            const dateStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')}`;

            const newPost = {
                author: author || '충신동 주민',
                title: title,
                content: content,
                date: dateStr
            };

            try {
                const existing = JSON.parse(localStorage.getItem('choongsin_community_posts') || '[]');
                existing.push(newPost);
                localStorage.setItem('choongsin_community_posts', JSON.stringify(existing));
            } catch (err) {
                console.error(err);
            }

            alert('게시글이 성공적으로 등록되었습니다.');
            window.location.href = 'community_board.html';
        });
    </script>
</body>
</html>
